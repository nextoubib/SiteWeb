name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: Branch policy
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate source branch for the target branch
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          echo "Pull request: $HEAD_REPO:$HEAD_REF -> $BASE_REPO:$BASE_REF"

          if [ "$BASE_REF" = "main" ]; then
            case "$HEAD_REF" in
              develop|hotfix/*)
                echo "OK: '$HEAD_REF' is an allowed source for 'main'."
                ;;
              *)
                echo "::error title=Branch policy::Pull requests into 'main' must come from 'develop' (release) or 'hotfix/*'. Got '$HEAD_REF'."
                echo "Open the pull request against 'develop' instead, then release develop -> main."
                exit 1
                ;;
            esac
          elif [ "$BASE_REF" = "develop" ]; then
            case "$HEAD_REF" in
              main)
                echo "::error title=Branch policy::'main' must not be merged into 'develop' through a pull request. Use a back-merge only after a hotfix."
                exit 1
                ;;
              feature/*|fix/*|chore/*|hotfix/*|docs/*|refactor/*|ci/*|perf/*|claude/*|dependabot/*)
                echo "OK: '$HEAD_REF' follows the branch naming convention."
                ;;
              *)
                echo "::warning title=Branch policy::'$HEAD_REF' does not follow the feature/*, fix/*, chore/* convention."
                ;;
            esac
          fi

  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SITE_URL: https://nexrad.org
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Format check
        run: pnpm format:check
