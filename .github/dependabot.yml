version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "develop"
    open-pull-requests-limit: 5
    groups:
      next:
        patterns:
          - "next"
          - "eslint-config-next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      tooling:
        patterns:
          - "eslint*"
          - "prettier*"
          - "typescript"
          - "vitest"
          - "@vitejs/*"
          - "@playwright/test"
          - "@testing-library/*"
          - "jsdom"
      ui:
        patterns:
          - "radix-ui"
          - "lucide-react"
          - "motion"
          - "tailwindcss"
          - "@tailwindcss/*"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "develop"
    commit-message:
      prefix: "ci(actions)"
